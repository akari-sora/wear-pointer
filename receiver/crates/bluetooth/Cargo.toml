[package]
name = "wear-pointer-bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "BLE transport for pointer packets. Central is Stage 1; peripheral is the swappable fallback."

[dependencies]
anyhow = "1"
async-trait = "0.1"
btleplug = "0.11.8"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
uuid = "1"
wear-pointer-core = { path = "../core" }
