[package]
name = "wear-pointer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Desktop receiver and tray/menu-bar app for the wear-pointer watch app."
default-run = "wear-pointer"

[[bin]]
name = "wear-pointer"
path = "src/main.rs"

[[bin]]
name = "wear-pointer-app"
path = "src/app_main.rs"

[features]
uinput = ["wear-pointer-platform/uinput"]

[dependencies]
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
wear-pointer-bluetooth = { path = "../bluetooth" }
wear-pointer-core = { path = "../core" }
wear-pointer-platform = { path = "../platform" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2"
